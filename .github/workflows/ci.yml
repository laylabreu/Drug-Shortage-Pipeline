name: CI
on: 
  push:
jobs:
  lint: 
    runs-on: ubuntu-latest
    steps: 
    #uses means run a prebuilt action someone else wrote
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: ruff check .
